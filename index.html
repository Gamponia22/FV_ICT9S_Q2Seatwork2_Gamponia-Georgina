<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 SEATWORK 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <style>
        body {
            margin: 0;
            background-image: url("https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/eb98ffc0-3110-41ac-af77-7139e634afea/OBMC+Intermediate+classroom+3.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .main-content {
            background-color: rgba(0, 0, 0, 0.15);
            min-height: 90vh;
            padding: 50px
        }

        .office-title {
            background-color: rgb(235, 255, 224);
            text-align: center;
            padding: 8px;
            font-family:Georgia, 'Times New Roman', Times, serif;
            font-size: 15px;
        }

        .contact-box {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
        }

        .contact-box h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-success {
            width: 100%;
        }
    </style>
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img src="https://files.orangeapps.ph/disk001/School_Files/1/school-66/school_profile/1724046763-1128.png"
            height="55" width="55" class="rounded-circle">
        </a>

        <div class="navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Contact Us</a>
                </li>
            </ul>

            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-success" type="button">Search</button>
            </form>
        </div>

    </div>
</nav>

<div class="main-content">

    <div class="container">
        <div class="row justify-content-around">

            <div class="col-lg-7 mb-4">

                <div class="office-title">
                    <h2>School Office Hours</h2>
                </div>

                <table class="table table-bordered table-striped text-center">

                    <thead class="table-primary">
                        <tr>
                            <th>Day</th>
                            <th>Office Hours</th>
                            <th>Department</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Monday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Registrar's Office</td>
                        </tr>

                        <tr>
                            <td>Tuesday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Accounting Office</td>
                        </tr>

                        <tr>
                            <td>Wednesday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Guidance Office</td>
                        </tr>

                        <tr>
                            <td>Thursday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Principal's Office</td>
                        </tr>

                        <tr>
                            <td>Friday</td>
                            <td>8:00 AM – 3:00 PM</td>
                            <td>Admin Office</td>
                        </tr>
                    </tbody>

                </table>

            </div>

            <div class="col-lg-4">

                <div class="contact-box">

                    <h1>Contact Us</h1>

                    <form>

                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control mb-3"
                               placeholder="Enter your full name">

                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control mb-3"
                               placeholder="Enter your email">

                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control mb-3"
                               placeholder="Enter subject">

                        <label class="form-label">Message</label>
                        <textarea class="form-control mb-3" rows="4"
                                  placeholder="Type your message here"></textarea>

                        <button type="button" class="btn btn-success">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
